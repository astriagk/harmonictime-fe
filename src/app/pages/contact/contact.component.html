<app-header-four></app-header-four>

<main>
  <app-breadcrumb-three
    title="Contact Us"
    subtitle="Contact"
  ></app-breadcrumb-three>

  <section class="contact__area pt-60 pb-60">
    <div class="container">
      <div class="row">
        <div class="col-xl-6 col-lg-6">
          <div class="contact__info">
            <h3>Find us here.</h3>
            <ul class="mb-55">
              <li class="d-flex mb-35">
                <div class="contact__info-icon mr-20">
                  <i class="fal fa-map-marker-alt"></i>
                </div>
                <div class="contact__info-content">
                  <h6>Address:</h6>
                  <span>{{ details.address }}</span>
                </div>
              </li>
              <li class="d-flex mb-35">
                <div class="contact__info-icon mr-20">
                  <i class="fal fa-envelope-open-text"></i>
                </div>
                <div class="contact__info-content">
                  <h6>Email:</h6>
                  <span>{{ details.email }}</span>
                </div>
              </li>
              <li class="d-flex mb-35">
                <div class="contact__info-icon mr-20">
                  <i class="fal fa-phone-alt"></i>
                </div>
                <div class="contact__info-content">
                  <h6>Number Phone:</h6>
                  <span>{{ details.phone }}</span>
                </div>
              </li>
            </ul>
            <p>
              {{ details.description }}
            </p>

            <div class="contact__social">
              <ul>
                <li *ngFor="let item of social_links">
                  <a [href]="item.link" target="_blank"
                    ><i [class]="item.icon"></i
                  ></a>
                </li>
              </ul>
            </div>
          </div>
        </div>
        <div class="col-xl-6 col-lg-6">
          <div class="contact__form">
            <h3>Contact Us.</h3>
            <app-contact-form></app-contact-form>
            <p class="ajax-response"></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="contact__map">
    <div class="container-fluid p-0">
      <div class="row g-0">
        <div class="col-xl-12">
          <div class="contact__map-wrapper p-relative">
            <iframe [src]="mapUrl"></iframe>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- <app-subscribe-area></app-subscribe-area> -->
</main>

<app-footer-one></app-footer-one>
