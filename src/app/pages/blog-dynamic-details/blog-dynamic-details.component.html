<!-- header start -->
<app-header-four></app-header-four>
<!-- header end -->

<main>
  <!-- breadcrumb start -->
  <app-breadcrumb-three
    [title]="breadcrumbTitle"
    subtitle="Blog"
    subtitleLink="/pages/blog-3-col"
    [current]="blog?.Category || ''"
  ></app-breadcrumb-three>
  <!-- breadcrumb end -->

  <!-- blog details area start -->
  <div *ngIf="loading" class="container pt-55">
    <app-skeleton type="hero" [count]="1"></app-skeleton>
    <app-skeleton type="text" [count]="6"></app-skeleton>
  </div>

  <!-- 410 — the post was archived rather than never existing -->
  <app-empty-state
    *ngIf="!loading && gone"
    message="This Article Has Been Removed"
    actionLabel="Browse The Blog"
    actionLink="/pages/blog-3-col"
  ></app-empty-state>

  <app-blog-details-area
    *ngIf="!loading && blog"
    [blog]="blog"
  ></app-blog-details-area>
  <!-- blog details area end -->
</main>

<!-- footer start -->
<app-footer-one></app-footer-one>
<!-- footer end -->
