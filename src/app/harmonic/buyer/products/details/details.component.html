<app-breadcrumb-two
  title="Product Details"
  subtitle="Product Details"
></app-breadcrumb-two>
<!-- breadcrumb end -->

<!-- shop details area start -->
<app-product-details-area
  *ngIf="product; else detailSkeleton"
  [product]="product"
></app-product-details-area>
<ng-template #detailSkeleton>
  <section class="shop__details-area pt-100 pb-100">
    <div class="container">
      <app-skeleton type="product-detail"></app-skeleton>
    </div>
  </section>
</ng-template>
<!-- shop details area end -->
