<!-- breadcrumb start -->
<app-breadcrumb-two title="Wishlist" subtitle="Wishlist"></app-breadcrumb-two>
<!-- breadcrumb end -->

<!-- wishlist area start-->
<section class="cart-area pt-100 pb-100">
  <div class="container">
    <div
      *ngIf="wishlistService.getWishlistProducts().length === 0"
      class="text-center pt-50"
    >
      <h3>No Wishlist Items Found</h3>
      <a routerLink="/buyer/products" class="os-btn os-btn-black mt-20"
        >Continue Shopping</a
      >
    </div>
    <div *ngIf="wishlistService.getWishlistProducts().length > 0" class="row">
      <div class="col-12">
        <div class="table-content table-responsive">
          <table class="table">
            <thead>
              <tr>
                <th class="product-thumbnail">Images</th>
                <th class="cart-product-name">Product</th>
                <th class="product-price">Unit Price</th>
                <th class="product-quantity">Quantity</th>
                <th class="product-remove">Remove</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of wishlistService.getWishlistProducts()">
                <td class="product-thumbnail">
                  <a [routerLink]="['/buyer/product-details', item._id]">
                    <img [src]="item?.Images | primaryImage" alt="product-img" />
                  </a>
                </td>
                <td class="product-name">
                  <a [routerLink]="['/buyer/product-details', item._id]">{{
                    item.ProductName
                  }}</a>
                </td>
                <td class="product-price">
                  <span class="amount">{{ item.Price | platformPrice | currency : "INR" }}</span>
                </td>
                <td class="product-quantity">
                  <button
                    (click)="cartService.addCartProduct(item)"
                    class="os-btn os-btn-black"
                  >
                    Add TO Cart
                  </button>
                </td>
                <td class="product-remove">
                  <a
                    (click)="wishlistService.removeWishlist(item)"
                    class="cursor-pointer"
                  >
                    <i class="fa fa-times"></i>
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</section>
