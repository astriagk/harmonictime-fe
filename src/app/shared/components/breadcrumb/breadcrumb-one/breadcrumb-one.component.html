<section
  class="page__title p-relative d-flex align-items-center"
  [style.background-image]="'url(' + bg_img + ')'"
>
  <div class="container">
    <div class="row">
      <div class="col-xl-12">
        <div class="page__title-inner text-center">
          <h1>{{ title }}</h1>
          <div class="page__title-breadcrumb">
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb justify-content-center">
                <li class="breadcrumb-item"><a routerLink="/">Home</a></li>
                <li class="breadcrumb-item active" aria-current="page">
                  {{ subtitle }}
                </li>
              </ol>
            </nav>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<div class="seller-verify-banner"
  [class.seller-verify-banner--rejected]="sellerVerificationStatus === 'Rejected'"
  *ngIf="showVerificationBanner">
  <div class="seller-verify-banner__body">
    <i class="fas fa-triangle-exclamation seller-verify-banner__icon"></i>
    <span class="seller-verify-banner__text">{{ sellerVerificationNote }}</span>
    <a [routerLink]="sellerVerificationStatus === 'Pending' ? '/buyer/account' : '/auth/gst-onboarding'"
       class="seller-verify-banner__link">
      {{ sellerVerificationStatus === 'Pending' ? 'Update now' : 'Resubmit' }}
    </a>
  </div>
  <button class="seller-verify-banner__close" (click)="bannerDismissed = true" aria-label="Dismiss">
    <i class="fas fa-xmark"></i>
  </button>
</div>
