<section class="blog__area pt-55">
  <div class="container">
    <div class="row">
      <!-- NOTE: blog sidebar is currently disabled (see the commented-out
           sidebar column at the bottom of this row), so the post content spans
           the full width. To bring the sidebar back, restore the original
           classes on the line below and un-comment the sidebar column. -->
      <!-- WITH SIDEBAR: <div class="col-xl-9 col-lg-8"> -->
      <!-- WITHOUT SIDEBAR (active): -->
      <div class="col-xl-12 col-lg-12">
        <div class="postbox__title mb-30">
          <h1>{{ blog.Title }}</h1>
          <div class="blog__meta">
            <span
              >By <a href="#">{{ blog.Author }}</a></span
            >
            <span>/ {{ blog.PublishedAt | date: "dd MMM, yyyy" }}</span>
            <span *ngIf="blog.Category">/ {{ blog.Category }}</span>
          </div>
        </div>
        <div class="postbox__thumb w-img" *ngIf="heroImage">
          <img [src]="heroImage" [alt]="blog.Title" />
        </div>
        <!-- Article body — an ordered list of sections, each some text and
             optionally an image beneath it. This reproduces the static page's
             layout (text, then a full-width image, then more text) with the
             author choosing where each picture sits. -->
        <div class="postbox__wrapper mb-70">
          <ng-container *ngFor="let section of sections">
            <h2 class="postbox__section-heading" *ngIf="section.Heading">
              {{ section.Heading }}
            </h2>
            <div class="postbox__text" [innerHTML]="section.Html"></div>
            <div class="postbox__details-img w-img mb-60" *ngIf="section.Image">
              <img [src]="section.Image" [alt]="section.Caption || blog.Title" />
              <span class="postbox__caption" *ngIf="section.Caption">
                {{ section.Caption }}
              </span>
            </div>
          </ng-container>
        </div>
        <div class="postbox__share mb-95">
          <div class="row">
            <div class="col-xl-6 col-lg-6 col-md-6">
              <div class="postbox__social">
                <span>Share to friends:</span>
                <ul>
                  <li *ngFor="let item of social_links">
                    <a
                      (click)="shareTo(item)"
                      class="cursor-pointer"
                      [title]="'Share on ' + item.name"
                      ><i [class]="item.icon"></i
                    ></a>
                  </li>
                </ul>
              </div>
            </div>
            <div class="col-xl-6 col-lg-6 col-md-6">
              <div
                class="postbox__tag f-right"
                *ngIf="blog.Tags && blog.Tags.length"
              >
                <span>Tags :</span>
                <!-- The separator sits outside the link so the comma is not
                     part of the tag's hover target, and the space after it is
                     non-breaking — Angular strips whitespace-only text nodes
                     between elements, so a plain space would vanish. -->
                <ng-container
                  *ngFor="let tag of blog.Tags; let last = last"
                >
                  <a class="cursor-pointer">{{ tag }}</a
                  ><span class="postbox__tag-sep" *ngIf="!last">,&nbsp;</span>
                </ng-container>
              </div>
            </div>
          </div>
        </div>
        <ng-container *ngIf="related_blogs.length">
          <div class="postbox__related-title">
            <h3>You Might Also Like</h3>
          </div>
          <div class="postbox__related-item">
            <div class="row">
              <div
                *ngFor="let b of related_blogs"
                class="col-xl-6 col-lg-6 col-md-6"
              >
                <div class="blog__item mb-30">
                  <div class="blog__thumb fix">
                    <a
                      [routerLink]="['/pages/blog-details', linkFor(b)]"
                      class="w-img"
                    >
                      <img [src]="b.Image" [alt]="b.Title" />
                    </a>
                  </div>
                  <div class="blog__content">
                    <h4>
                      <a [routerLink]="['/pages/blog-details', linkFor(b)]">{{
                        b.Title
                      }}</a>
                    </h4>
                    <div class="blog__meta">
                      <span
                        >By <a href="#">{{ b.Author }}</a></span
                      >
                      <span>/ {{ b.PublishedAt | date: "dd MMM, yyyy" }}</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </ng-container>
