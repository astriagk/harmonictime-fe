<!-- Reusable address / billing-details form. Reuses the checkout .checkbox-form
     styles so it matches the rest of the app (see spec/THEME.md §7). -->
<form [formGroup]="addressForm" (ngSubmit)="onSubmit()" class="checkbox-form">
  <div class="row">
    <div class="col-md-6">
      <div class="checkout-form-list">
        <label>First Name <span class="required">*</span></label>
        <input
          type="text"
          placeholder="First name"
          formControlName="firstName"
        />
        <span
          *ngIf="
            firstName?.hasError('required') &&
            (firstName?.touched || formSubmitted)
          "
          class="text-danger"
        >
          First Name is required
        </span>
      </div>
    </div>
    <div class="col-md-6">
      <div class="checkout-form-list">
        <label>Last Name <span class="required">*</span></label>
        <input type="text" placeholder="Last name" formControlName="lastName" />
        <span
          *ngIf="
            lastName?.hasError('required') &&
            (lastName?.touched || formSubmitted)
          "
          class="text-danger"
        >
          Last Name is required
        </span>
      </div>
    </div>
    <div class="col-md-6">
      <div class="checkout-form-list">
        <label>Address <span class="required">*</span></label>
        <input
          type="text"
          placeholder="Street address"
          formControlName="address"
        />
        <span
          *ngIf="
            address2?.hasError('required') &&
            (address2?.touched || formSubmitted)
          "
          class="text-danger"
        >
          Address is required
        </span>
      </div>
    </div>
    <div class="col-md-6">
      <div class="checkout-form-list">
        <label>Apartment / Suite</label>
        <input
          type="text"
          formControlName="apartment"
          placeholder="Apartment, suite, etc. (optional)"
        />
      </div>
    </div>
    <div class="col-md-6">
      <div class="checkout-form-list">
        <label>Town / City <span class="required">*</span></label>
        <input type="text" placeholder="Town / City" formControlName="city" />
        <span
          *ngIf="city?.hasError('required') && (city?.touched || formSubmitted)"
          class="text-danger"
        >
          City is required
        </span>
      </div>
    </div>
    <div class="col-md-6">
      <div class="checkout-form-list">
        <label>State / County <span class="required">*</span></label>
        <input
          type="text"
          placeholder="State / County"
          formControlName="state"
        />
        <span
          *ngIf="
            state?.hasError('required') && (state?.touched || formSubmitted)
          "
          class="text-danger"
        >
          State is required
        </span>
      </div>
    </div>
    <div class="col-md-6">
      <div class="checkout-form-list">
        <label>Postcode / Zip <span class="required">*</span></label>
        <input
          type="text"
          placeholder="Postcode / Zip"
          formControlName="zipCode"
        />
        <span
          *ngIf="
            zipCode?.hasError('required') && (zipCode?.touched || formSubmitted)
          "
          class="text-danger"
        >
          ZipCode is required
        </span>
      </div>
    </div>
    <div class="col-md-6">
      <div class="country-select">
        <label>Country <span class="required">*</span></label>
        <select formControlName="country">
          <option *ngFor="let c of countries" [value]="c">{{ c }}</option>
        </select>
        <span
          *ngIf="
            country?.hasError('required') && (country?.touched || formSubmitted)
          "
          class="text-danger"
        >
          Country is required
        </span>
      </div>
    </div>
    <div class="col-md-6">
      <div class="checkout-form-list">
        <label>Phone <span class="required">*</span></label>
        <input type="text" placeholder="Phone" formControlName="phone" />
        <span
          *ngIf="
            phone?.hasError('required') && (phone?.touched || formSubmitted)
          "
          class="text-danger"
        >
          Phone is required
        </span>
      </div>
    </div>
    <div class="col-md-6 d-flex align-items-center">
      <div class="checkout-form-list mb-0">
        <label
          class="d-inline-flex align-items-center mb-0"
          style="cursor: pointer"
        >
          <input type="checkbox" formControlName="isDefault" class="mr-10" />
          Set as default address
        </label>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-end mt-10">
    <button type="button" class="os-btn mr-5" (click)="onCancel()">
      Cancel
    </button>
    <button type="submit" class="os-btn os-btn-black" [disabled]="saving">
      {{ saving ? "Saving…" : address?._id ? "Update Address" : "Add Address" }}
    </button>
  </div>
</form>
