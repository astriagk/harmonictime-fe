<!-- Reusable bank account form. Reuses the checkout .checkbox-form styles so it
     matches the rest of the app (see spec/THEME.md §7). -->
<form [formGroup]="bankForm" (ngSubmit)="onSubmit()" class="checkbox-form">
  <div class="row">
    <div class="col-md-6">
      <div class="checkout-form-list">
        <label>Account Holder Name <span class="required">*</span></label>
        <input
          type="text"
          placeholder="Name as per bank records"
          formControlName="accountHolderName"
        />
        <span
          *ngIf="
            accountHolderName?.hasError('required') &&
            (accountHolderName?.touched || formSubmitted)
          "
          class="text-danger"
        >
          Account Holder Name is required
        </span>
      </div>
    </div>
    <div class="col-md-6">
      <div class="checkout-form-list">
        <label>Bank Name <span class="required">*</span></label>
        <input type="text" placeholder="Bank name" formControlName="bankName" />
        <span
          *ngIf="
            bankName?.hasError('required') &&
            (bankName?.touched || formSubmitted)
          "
          class="text-danger"
        >
          Bank Name is required
        </span>
      </div>
    </div>
    <div class="col-md-6">
      <div class="checkout-form-list">
        <label>Account Number <span class="required">*</span></label>
        <input
          type="text"
          placeholder="Account number"
          formControlName="accountNumber"
        />
        <span
          *ngIf="
            accountNumber?.hasError('required') &&
            (accountNumber?.touched || formSubmitted)
          "
          class="text-danger"
        >
          Account Number is required
        </span>
        <span
          *ngIf="
            accountNumber?.hasError('pattern') &&
            (accountNumber?.touched || formSubmitted)
          "
          class="text-danger"
        >
          Account Number must be 6–18 digits
        </span>
      </div>
    </div>
    <div class="col-md-6">
      <div class="checkout-form-list">
        <label>IFSC Code <span class="required">*</span></label>
        <input
          type="text"
          placeholder="e.g. HDFC0001234"
          formControlName="ifsc"
          style="text-transform: uppercase"
        />
        <span
          *ngIf="ifsc?.hasError('required') && (ifsc?.touched || formSubmitted)"
          class="text-danger"
        >
          IFSC Code is required
        </span>
        <span
          *ngIf="ifsc?.hasError('pattern') && (ifsc?.touched || formSubmitted)"
          class="text-danger"
        >
          Enter a valid IFSC code
        </span>
      </div>
    </div>
    <div class="col-md-12 d-flex align-items-center">
      <div class="checkout-form-list mb-0">
        <label
          class="d-inline-flex align-items-center mb-0"
          style="cursor: pointer"
        >
          <input type="checkbox" formControlName="isDefault" class="mr-10" />
          Set as default payout account
        </label>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-end mt-10">
    <button type="button" class="os-btn mr-5" (click)="onCancel()">
      Cancel
    </button>
    <button type="submit" class="os-btn os-btn-black" [disabled]="saving">
      {{ saving ? "Saving…" : account?._id ? "Update Account" : "Add Account" }}
    </button>
  </div>
</form>
