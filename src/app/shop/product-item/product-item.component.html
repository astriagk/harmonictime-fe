<div class="product__wrapper mb-60">
  <div class="product__thumb">
    <a [routerLink]="['/buyer/product-details', product._id]" class="w-img">
      <img [src]="product?.Images | primaryImage" alt="product-img" />
      <img
        class="product__thumb-2"
        [src]="product?.Images | secondaryImage"
        alt="product-img"
      />
    </a>
    <div class="product__action transition-3">
      <a
        (click)="addToWishlist(product)"
        class="cursor-pointer"
        [class.active]="isItemInWishlist(product)"
        data-bs-toggle="tooltip"
        data-placement="top"
        title="Add to Wishlist"
      >
        <i
          [ngClass]="
            isItemInWishlist(product) ? 'fas fa-heart' : 'fal fa-heart'
          "
        ></i>
      </a>
      <!-- <a
        (click)="addToCompare(product)"
        class="cursor-pointer"
        [class.active]="isItemInCompare(product)"
        data-toggle="tooltip"
        data-placement="top"
        title="Compare"
      >
        <i class="fal fa-sliders-h"></i>
      </a> -->
      <!-- <a
        class="cursor-pointer"
        data-bs-toggle="modal"
        [attr.data-bs-target]="'#' + utilsService.modalId"
        (click)="
          utilsService.handleOpenModal('product-modal-' + product.id, product)
        "
      >
        <i class="fal fa-search"></i>
      </a> -->
    </div>
    <div *ngIf="product.Offer?.IsActive" class="product__sale">
      <span class="new">Sale</span>
      <span class="percent">-{{ product.Offer?.DiscountPercentage }}%</span>
    </div>
  </div>
  <div class="product__content p-relative">
    <div class="product__content-inner">
      <h4>
        <a
          [routerLink]="['/buyer/product-details', product._id]"
          [innerHTML]="product.Details.BrandName"
        ></a>
      </h4>
      <div class="product__price transition-3">
        <span *ngIf="product.Offer?.IsActive && product.DisplayPrice">
          {{ product.DisplayPrice * (1 - product.Offer.DiscountPercentage / 100) | currency: "INR" }}
        </span>
        <span [class.old-price]="product.Offer?.IsActive && product.DisplayPrice">
          {{ product.DisplayPrice | currency: "INR" }}
        </span>
      </div>
    </div>
    <div class="add-cart p-absolute transition-3">
      <a
        *ngIf="!(isProductInCart$(product._id) | async)"
        (click)="addToCart(product)"
        class="cursor-pointer"
      >
        + Add to Cart
      </a>
      <a
        *ngIf="isProductInCart$(product._id) | async"
        routerLink="/buyer/cart"
        class="cursor-pointer"
      >
        View Cart
      </a>
    </div>
  </div>
</div>
